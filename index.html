<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Master Pro - Hybrid Edition</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root { --primary: #667eea; --success: #28a745; --danger: #dc3545; --warning: #ff9800; --info: #17a2b8; --purple: #764ba2; --vip-gold: #ffd700; --collection: #20c997; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea, #764ba2); min-height: 100vh; color: #333; }
        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.2); padding: 10px 25px; color: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .btn { padding: 8px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.3s; font-size: 13px; }
        .tab-nav { display: flex; justify-content: center; gap: 10px; padding: 20px 0 0 0; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: none; border-radius: 8px; background: rgba(255, 255, 255, 0.2); color: white; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 5px; }
        .tab-btn.active { background: white; color: var(--purple); }
        .container { max-width: 450px; margin: 20px auto 40px auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); display: none; }
        .container.active { display: block; }
        .admin-wide { max-width: 1250px; }
        .input-group { margin-bottom: 12px; }
        label { font-weight: 600; font-size: 14px; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        .submit-btn { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 6px; background: var(--primary); color: white; font-size: 16px; cursor: pointer; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr 1.5fr; gap: 20px; margin-bottom: 20px; }
        .dashboard-box { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .db-columns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .db-col { background: #fff; border: 2px solid #ddd; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; height: 550px; }
        .db-col-header { padding: 12px; color: white; font-weight: bold; text-align: center; text-transform: uppercase; }
        .col-registry { background: var(--purple); }
        .col-record { background: var(--primary); }
        .col-due { background: var(--warning); }
        .col-collection { background: var(--collection); }
        .col-content { flex-grow: 1; overflow-y: auto; font-size: 12px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #eee; padding: 10px; text-align: left; }
        .export-area { padding: 15px; background: #fff; border-top: 1px solid #eee; text-align: center; }
        .export-btn-rect { width: 90%; padding: 10px; border: 2px solid #ddd; background: white; color: var(--danger); font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; font-size: 12px; }
        .vip-badge { background: var(--vip-gold); color: #000; padding: 2px 4px; border-radius: 4px; font-weight: bold; font-size: 9px; margin-left: 5px; }
        .user-mgmt-table { width: 100%; font-size: 11px; border-collapse: collapse; margin-top: 5px; }
        .del-btn { color: var(--danger); cursor: pointer; border: none; background: none; font-weight: bold; }
        #profileInfo { font-size: 12px; color: white; margin-right: 15px; background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 20px; }
    </style>
</head>
<body>

<nav class="navbar">
    <div style="font-weight: bold; font-size: 20px;">CRM MASTER</div>
    <div style="display: flex; align-items: center;">
        <span id="profileInfo" style="display: none;"></span>
        <button class="btn" style="background: var(--info)" id="loginNavBtn">Login</button>
        <button class="btn" style="background: var(--danger); display:none;" id="logoutBtn" onclick="handleLogout()">Logout</button>
    </div>
</nav>

<div id="tabNav" class="tab-nav" style="display: none;">
    <button class="tab-btn active" onclick="switchTab(event, 'RECORD')">RECORD</button>
    <button class="tab-btn" onclick="switchTab(event, 'REGISTRY')">REGISTRY</button>
    <button class="tab-btn" onclick="switchTab(event, 'DUE')">DUE ENTRY</button>
    <button class="tab-btn" style="background: var(--collection);" onclick="switchTab(event, 'COLLECTION')">AMOUNT COLLECTION</button>
    <button class="tab-btn" id="adminTab" style="display:none;" onclick="switchTab(event, 'ADMIN')">ADMIN DASHBOARD</button>
    <button class="tab-btn" style="background: var(--info);" onclick="switchTab(event, 'PROFILE')">⚙️ MY SETTINGS</button>
</div>

<div class="container active" id="loginSection">
    <h2>Admin Login</h2>
    <div class="input-group"><label>Email</label><input type="email" id="loginId" placeholder="example@email.com"></div>
    <div class="input-group"><label>Password</label><input type="password" id="loginPass"></div>
    <button class="submit-btn" onclick="handleLogin()">Access Dashboard</button>
</div>

<div id="section-COLLECTION" class="container">
    <h2>AMMOUNT COLLECTION</h2>
    <form onsubmit="handleFormSubmit(event, 'COLLECTION')">
        <div class="input-group"><label>Date</label><input type="date" name="date" required id="collDate"></div>
        <div class="input-group"><label>Amount</label><input type="number" name="amount" required></div>
        <div class="input-group"><label>Purpose</label><textarea name="purpose" required></textarea></div>
        <button type="submit" class="submit-btn" style="background: var(--collection);">Submit Collection</button>
    </form>
</div>

<div id="section-RECORD" class="container">
    <h2>RECORD ENTRY</h2>
    <form onsubmit="handleFormSubmit(event, 'RECORD')">
        <div class="input-group"><label>Name</label><input type="text" name="name" required></div>
        <div class="input-group"><label>Mobile</label><input type="tel" name="mobile" required></div>
        <div class="input-group"><label>Address</label><textarea name="address"></textarea></div>
        <button type="submit" class="submit-btn">Submit Record</button>
    </form>
</div>

<div id="section-REGISTRY" class="container">
    <h2>REGISTRY ENTRY</h2>
    <form onsubmit="handleFormSubmit(event, 'REGISTRY')">
        <div class="input-group"><label>Name</label><input type="text" name="name" required></div>
        <div class="input-group"><label>Mobile</label><input type="tel" name="mobile" required></div>
        <div class="input-group"><label>Info</label><textarea name="address" required></textarea></div>
        <button type="submit" class="submit-btn">Submit Registry</button>
    </form>
</div>

<div id="section-DUE" class="container">
    <h2>DUE ENTRY</h2>
    <form onsubmit="handleFormSubmit(event, 'DUE')">
        <div class="input-group"><label>Name</label><input type="text" name="name" required></div>
        <div class="input-group"><label>Mobile</label><input type="tel" name="mobile" required></div>
        <div class="input-group"><label>Due Amount</label><input type="number" name="due" required></div>
        <button type="submit" class="submit-btn">Submit Due</button>
    </form>
</div>

<div id="section-PROFILE" class="container">
    <h2>Update Password</h2>
    <div class="input-group"><label>New Password</label><input type="password" id="newPassInput"></div>
    <button class="submit-btn" style="background: var(--success);" onclick="updateOwnPassword()">Update Password</button>
</div>

<div id="section-ADMIN" class="container admin-wide">
    <div class="admin-grid">
        <div class="dashboard-box">
            <h3 style="margin:0;">📊 Quick Status</h3>
            <input type="date" id="filterDate" onchange="refreshAdmin()" style="margin: 10px 0;">
            <div style="font-size:12px;">Reg: <b id="statRegistry">0</b> | Rec: <b id="statRecord">0</b> | Due: <b id="statDue">0</b> | Coll: <b id="statColl">0</b></div>
        </div>
        <div class="dashboard-box" style="border-left: 5px solid var(--vip-gold);">
            <h3 style="margin: 0;">🌟 VIP Tracker</h3>
            <div style="max-height: 120px; overflow-y: auto; margin-top:10px;">
                <table class="user-mgmt-table" id="vipTable">
                    <thead><tr><th>Name</th><th>Mobile</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="db-columns">
        <div class="db-col" style="border-color: var(--purple);"><div class="db-col-header col-registry">REGISTRY</div><div class="col-content"><table id="tableRegistry"><thead><tr><th>Name</th><th>Info</th><th>Action</th></tr></thead><tbody></tbody></table></div><div class="export-area"><button class="export-btn-rect" onclick="exportToExcel('REGISTRY')">Excel</button></div></div>
        <div class="db-col" style="border-color: var(--primary);"><div class="db-col-header col-record">RECORD</div><div class="col-content"><table id="tableRecord"><thead><tr><th>Name</th><th>Mobile</th><th>Action</th></tr></thead><tbody></tbody></table></div><div class="export-area"><button class="export-btn-rect" onclick="exportToExcel('RECORD')">Excel</button></div></div>
        <div class="db-col" style="border-color: var(--warning);"><div class="db-col-header col-due">DUE</div><div class="col-content"><table id="tableDue"><thead><tr><th>Name</th><th>Amt</th><th>Action</th></tr></thead><tbody></tbody></table></div><div class="export-area"><button class="export-btn-rect" onclick="exportToExcel('DUE')">Excel</button></div></div>
        <div class="db-col" style="border-color: var(--collection);"><div class="db-col-header col-collection">COLLECTION</div><div class="col-content"><table id="tableCollection"><thead><tr><th>Purpose</th><th>Amt</th><th>Action</th></tr></thead><tbody></tbody></table></div><div class="export-area"><button class="export-btn-rect" onclick="exportToExcel('COLLECTION')">Excel</button></div></div>
    </div>
</div>

<script>
    // --- 1. Your Original Google Sheets URLs (Unchanged) ---
    const SHEET_URLS = { 
        'RECORD': "https://script.google.com/macros/s/AKfycbzafhJqZnQk2cW5LWls-Co0Z1qGWa71orHx2b8KgokYCEvtzdfwqUF20KOoWtlvI4xR7Q/exec", 
        'REGISTRY': "https://script.google.com/macros/s/AKfycbyRraJc791dVabOxFGKfmI_mXejg2w4cOJmNFaDDB9enquHr5jg_psvnbxEY4_IDtBP/exec", 
        'DUE': "https://script.google.com/macros/s/AKfycbxPYb6IciiX2p0GupukiHfam_eF6wOZc9ADTw4p6zlDfeVxLiy0O1_V3v3YRcm3iOom/exec",
        'COLLECTION': "https://script.google.com/macros/s/AKfycbzL0_QoDRzpIYT0gQBQEWiKKwFVRp-WlhCP7ALZS4b65NjZD2ZoQLCd0biQUY16Lc2T/exec" 
    };

    // --- 2. Firebase Configuration (Insert your data here) ---
const firebaseConfig = {
        apiKey: "AIzaSyCsNJzANojHiFccng9r4S2y_l4zj7jvtu0",
        authDomain: "crm-maste.firebaseapp.com",
        projectId: "crm-maste",
        storageBucket: "crm-maste.firebasestorage.app",
        messagingSenderId: "68763525440",
        appId: "1:68763525440:web:7538f80a9f3b3dcab79aa5",
        measurementId: "G-EXRW4T5V1V"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const fdb = firebase.firestore();

    // --- ২. Auth state observer (লগইন স্ট্যাটাস চেক) ---
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('tabNav').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('profileInfo').innerText = "User: " + user.email;
            document.getElementById('profileInfo').style.display = 'block';
            document.getElementById('adminTab').style.display = 'block';
            switchTab(null, 'RECORD');
            listenToFirebase(); 
        } else {
            document.getElementById('loginSection').style.display = 'block';
            document.getElementById('tabNav').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('profileInfo').style.display = 'none';
        }
    });

    // --- ৩. Login Function (ভুল সংশোধন করা হয়েছে) ---
    async function handleLogin() {
        const email = document.getElementById('loginId').value.trim(); // .trim() যোগ করা হয়েছে
        const pass = document.getElementById('loginPass').value.trim();
        
        if(!email || !pass) {
            alert("Please enter both Email and Password");
            return;
        }

        try { 
            await auth.signInWithEmailAndPassword(email, pass); 
            alert("Login Successful!");
        } catch (e) { 
            console.error(e);
            alert("Error: " + e.message); // এরর মেসেজ দেখাবে কেন লগইন হচ্ছে না
        }
    }

    function handleLogout() { 
        auth.signOut().then(() => {
            location.reload();
        });
    }

    // --- 3. Dual Submission Logic (Firebase + Google Sheets) ---
    async function handleFormSubmit(e, type) {
        e.preventDefault();
        const submitBtn = e.target.querySelector('button[type="submit"]');
        const originalBtnText = submitBtn.innerText;
        submitBtn.innerText = "Syncing...";
        submitBtn.disabled = true;

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        const entry = {
            ...data,
            type: type,
            date: type === 'COLLECTION' ? data.date : new Date().toISOString().split('T')[0],
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        };

        try {
            // ১. গুগল শিটে পাঠানো (আপনার অরিজিনাল লজিক)
            const scriptURL = SHEET_URLS[type];
            const sheetPromise = fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(entry)
            });

            // ২. ফায়ারবেস ফায়ারস্টোরে পাঠানো
            const firebasePromise = fdb.collection('crm_data').add(entry);

            // উভয়টি সম্পন্ন হওয়া পর্যন্ত অপেক্ষা
            await Promise.all([sheetPromise, firebasePromise]);

            alert("Data synced to Google Sheets & Firebase!");
            e.target.reset();
        } catch (error) {
            console.error(error);
            alert("Error during sync. Please check connection.");
        } finally {
            submitBtn.innerText = originalBtnText;
            submitBtn.disabled = false;
        }
    }

    // --- 4. Real-time Firebase Sync for Dashboard ---
    let allData = [];
    function listenToFirebase() {
        fdb.collection('crm_data').orderBy('timestamp', 'desc')
            .onSnapshot(snapshot => {
                allData = snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
                refreshAdmin();
            });
    }

    function refreshAdmin() {
        const selDate = document.getElementById('filterDate').value || new Date().toISOString().split('T')[0];
        const filtered = allData.filter(i => i.date === selDate);
        
        document.getElementById('statRecord').innerText = filtered.filter(i=>i.type==='RECORD').length;
        document.getElementById('statRegistry').innerText = filtered.filter(i=>i.type==='REGISTRY').length;
        document.getElementById('statDue').innerText = filtered.filter(i=>i.type==='DUE').length;
        document.getElementById('statColl').innerText = filtered.filter(i=>i.type==='COLLECTION').length;

        const renderTable = (type) => allData.filter(i => i.type === type).map((item) => `
            <tr>
                <td>${item.purpose || item.name}</td>
                <td>${item.amount || item.due || item.mobile}</td>
                <td><button class="del-btn" onclick="deleteEntry('${item.id}')">×</button></td>
            </tr>
        `).join('');

        document.querySelector('#tableRegistry tbody').innerHTML = renderTable('REGISTRY');
        document.querySelector('#tableRecord tbody').innerHTML = renderTable('RECORD');
        document.querySelector('#tableDue tbody').innerHTML = renderTable('DUE');
        document.querySelector('#tableCollection tbody').innerHTML = renderTable('COLLECTION');
        renderVIPTracker();
    }

    function deleteEntry(docId) {
        if(confirm("Delete from Firebase? (Note: Won't delete from Google Sheet)")) {
            fdb.collection('crm_data').doc(docId).delete();
        }
    }

    function renderVIPTracker() {
        const registries = allData.filter(i => i.type === 'REGISTRY');
        const counts = {};
        registries.forEach(r => counts[r.mobile] = (counts[r.mobile] || 0) + 1);
        const uniqueVips = registries.filter((v, i, self) => counts[v.mobile] > 1 && self.findIndex(t => t.mobile === v.mobile) === i);

        document.querySelector('#vipTable tbody').innerHTML = uniqueVips.map(v => `
            <tr><td>${v.name} <span class="vip-badge">VIP</span></td><td>${v.mobile}</td></tr>
        `).join('');
    }

    function switchTab(e, type) {
        document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById('section-' + type).classList.add('active');
        if(e) e.target.classList.add('active');
        else document.querySelector(`[onclick*="'${type}'"]`).classList.add('active');
    }

    function exportToExcel(type) {
        const data = allData.filter(i => i.type === type);
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, type);
        XLSX.writeFile(wb, `${type}_Report.xlsx`);
    }

    function updateOwnPassword() {
        const newPass = document.getElementById('newPassInput').value;
        auth.currentUser.updatePassword(newPass).then(() => alert("Success!")).catch(e => alert(e.message));
    }
</script>
</body>
</html>
