  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Tailwind CSS Play CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icon System -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- React & DOM libraries -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel compiler for on-the-fly JSX transpilation -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;

    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
  <script>
    // Configure Tailwind to support any custom setups
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased overflow-hidden w-screen h-screen">
  <div id="root" class="w-full h-full"></div>

  <!-- React Code Base -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- TYPES & INTERFACES MOCK ---
    // Defined inside standard React environment helper scopes.

    // --- INITIAL DATA ASSETS ---
    const initialPatients = [

    ];

    const initialDoctors = [

      { id: 'DOC-102', name: 'Sajid Hasan', spec: 'Neurology', time: '06:00 PM - 08:30 PM', fees: 1200 },

    ];

    const initialStaff = [

      { id: 'STF-5002', name: 'Selim Uddin', role: 'Ward Boy', shift: 'Night (12 AM - 8 AM)', salary: 15000, status: 'Present' },

    ];

    const initialMedicines = [
      { name: 'Paracetamol 500mg', batch: 'B-PR882', qty: 150, price: 5 },
      { name: 'Amoxicillin 250mg', batch: 'B-AM201', qty: 8, price: 15 },
      { name: 'Metformin 850mg', batch: 'B-MT119', qty: 200, price: 8 },
      { name: 'Omeprazole 20mg', batch: 'B-OM545', qty: 5, price: 7 }
    ];

    const initialBeds = [
      { id: 'Cabin 101', type: 'Deluxe', status: 'Available' },
      { id: 'Cabin 102', type: 'Deluxe', status: 'Occupied' },
      { id: 'Cabin 103', type: 'General', status: 'Available' },
      { id: 'ICU Bed 1', type: 'Critical Care', status: 'Available' },
      { id: 'ICU Bed 2', type: 'Critical Care', status: 'Occupied' },
      { id: 'Ward Bed A', type: 'General', status: 'Available' },
      { id: 'Ward Bed B', type: 'General', status: 'Available' }
    ];

    const initialBills = [
      {
        invoice: 'INV-82190',
        patientId: 'PID-2841',
        patientName: 'Anisur Rahman',
        patientMobile: '01712345678',
        date: '5/18/2026',
        total: 5200,
        isDischarged: false,
        dischargeNotes: '',
        dispensedMedicines: [
          { name: 'Paracetamol 500mg', qty: 20, unitPrice: 5, subtotal: 100 },
          { name: 'Metformin 850mg', qty: 10, unitPrice: 8, subtotal: 80 }
        ],
        breakdown: { bed: 2500, doc: 1000, ot: 0, test: 1540, med: 180 }
      },
      {
        invoice: 'INV-45129',
        patientId: 'PID-9821',
        patientName: 'Rina Begum',
        patientMobile: '01823456789',
        date: '5/20/2026',
        total: 2000,
        isDischarged: true,
        dischargeNotes: 'Discharged under healthy stable recovery conditions. Prescribed standard post-clinical resting routine.',
        dispensedMedicines: [],
        breakdown: { bed: 0, doc: 1200, ot: 0, test: 800, med: 0 }
      }
    ];

    const initialAppointments = [
      { token: 'TK-101', name: 'Jasmin Ara', doc: 'Dr. Sajid Hasan (Neurology)', date: '2026-05-20' },
      { token: 'TK-102', name: 'Kamrul Islam', doc: 'Dr. Amina Rahman (Cardiology)', date: '2026-05-21' }
    ];


    // --- ROBUST DYNAMIC LUCIDE ICON COMPONENT ---
    const LucideIcon = ({ name, className }) => {
      const iconRef = useRef(null);

      useEffect(() => {
        if (iconRef.current && window.lucide) {
          iconRef.current.innerHTML = '';
          const iElement = document.createElement('i');
          iElement.setAttribute('data-lucide', name);
          if (className) {
            iElement.setAttribute('class', className);
          }
          iconRef.current.appendChild(iElement);
          window.lucide.createIcons({ node: iconRef.current });
        }
      }, [name, className]);

      return <span ref={iconRef} className="inline-flex items-center justify-center shrink-0"></span>;
    };


    // --- MAIN REACT APPLICATION ENGINE ---
    function App() {
      // Sidebar Navigation Tab Control State
      const [activeTab, setActiveTab] = useState('dashboard');

      // Database Entities States with LocalStorage Cache Persistance
      const [patients, setPatients] = useState(() => {
        const saved = localStorage.getItem('hms_patients');
        return saved ? JSON.parse(saved) : initialPatients;
      });

      const [doctors, setDoctors] = useState(() => {
        const saved = localStorage.getItem('hms_doctors');
        return saved ? JSON.parse(saved) : initialDoctors;
      });

      const [staff, setStaff] = useState(() => {
        const saved = localStorage.getItem('hms_staff');
        return saved ? JSON.parse(saved) : initialStaff;
      });

      const [medicines, setMedicines] = useState(() => {
        const saved = localStorage.getItem('hms_medicines');
        return saved ? JSON.parse(saved) : initialMedicines;
      });

      const [beds, setBeds] = useState(() => {
        const saved = localStorage.getItem('hms_beds');
        return saved ? JSON.parse(saved) : initialBeds;
      });

      const [bills, setBills] = useState(() => {
        const saved = localStorage.getItem('hms_bills');
        return saved ? JSON.parse(saved) : initialBills;
      });

      const [appointments, setAppointments] = useState(() => {
        const saved = localStorage.getItem('hms_appointments');
        return saved ? JSON.parse(saved) : initialAppointments;
      });

      // Synchronize states with LocalStorage on modification
      useEffect(() => { localStorage.setItem('hms_patients', JSON.stringify(patients)); }, [patients]);
      useEffect(() => { localStorage.setItem('hms_doctors', JSON.stringify(doctors)); }, [doctors]);
      useEffect(() => { localStorage.setItem('hms_staff', JSON.stringify(staff)); }, [staff]);
      useEffect(() => { localStorage.setItem('hms_medicines', JSON.stringify(medicines)); }, [medicines]);
      useEffect(() => { localStorage.setItem('hms_beds', JSON.stringify(beds)); }, [beds]);
      useEffect(() => { localStorage.setItem('hms_bills', JSON.stringify(bills)); }, [bills]);
      useEffect(() => { localStorage.setItem('hms_appointments', JSON.stringify(appointments)); }, [appointments]);

      // FILTER & SEARCH STATES
      const [searchPatient, setSearchPatient] = useState('');
      const [searchBillName, setSearchBillName] = useState('');
      const [searchBillPhone, setSearchBillPhone] = useState('');
      const [billStartDate, setBillStartDate] = useState('');
      const [billEndDate, setBillEndDate] = useState('');

      // EDIT MODE IDENTIFIERS
      const [editingPatientId, setEditingPatientId] = useState(null);
      const [editingDoctorId, setEditingDoctorId] = useState(null);
      const [editingStaffId, setEditingStaffId] = useState(null);
      const [editingMedName, setEditingMedName] = useState(null);
      const [editingBedId, setEditingBedId] = useState(null);
      const [editingAppToken, setEditingAppToken] = useState(null);

      // FORM BINDINGS STATES
      // Patient Form
      const [pForm, setPForm] = useState({
        name: '', age: '', gender: 'Male', mobile: '', guardian: '', relation: 'Father',
        blood: 'O+', type: 'OPD (Outpatient)', bed: 'None', emergency: '', history: ''
      });

      // Doctor Form
      const [dForm, setDForm] = useState({ name: '', spec: '', time: '', fees: '' });

      // Staff Form
      const [sForm, setSForm] = useState({ name: '', role: 'Nurse', shift: 'Day (8 AM - 4 PM)', salary: '' });

      // Medicine Form
      const [mForm, setMForm] = useState({ name: '', batch: '', qty: '', price: '' });

      // Bed Form
      const [bForm, setBForm] = useState({ id: '', type: 'General', status: 'Available' });

      // Appointment Form
      const [aForm, setAForm] = useState({ name: '', doc: '', date: '' });

      // Invoice / Bill Generation Bindings
      const [bPatient, setBPatient] = useState('');
      const [bDate, setBDate] = useState(() => new Date().toISOString().split('T')[0]);

      // PORTAL MODALS STATES
      const [activeInvoice, setActiveInvoice] = useState(null);
      const [isInvoiceOpen, setIsInvoiceOpen] = useState(false);

      const [activeBillAdjustment, setActiveBillAdjustment] = useState(null);
      const [isAdjustmentOpen, setIsAdjustmentOpen] = useState(false);
      const [adjBed, setAdjBed] = useState(0);
      const [adjDoc, setAdjDoc] = useState(0);
      const [adjOt, setAdjOt] = useState(0);
      const [adjTest, setAdjTest] = useState(0);
      const [adjMedSelected, setAdjMedSelected] = useState('');
      const [adjMedQty, setAdjMedQty] = useState(1);

      const [activeDischargeBill, setActiveDischargeBill] = useState(null);
      const [isDischargeOpen, setIsDischargeOpen] = useState(false);
      const [dischargeNotesText, setDischargeNotesText] = useState('');

      // --- SUBMIT COMPONENT FLOWS HANDLERS ---
      
      // Patient Save & Edit
      const handlePatientSubmit = (e) => {
        e.preventDefault();
        if (editingPatientId) {
          setPatients(prev => prev.map(p => {
            if (p.id === editingPatientId) {
              const oldBed = p.bed;
              const newBed = p.bed !== pForm.bed ? pForm.bed : oldBed;

              if (oldBed !== 'None' && oldBed !== newBed) {
                setBeds(pb => pb.map(b => b.id === oldBed ? { ...b, status: 'Available' } : b));
              }
              if (newBed !== 'None' && oldBed !== newBed) {
                setBeds(pb => pb.map(b => b.id === newBed ? { ...b, status: 'Occupied' } : b));
              }

              return {
                ...p, name: pForm.name, age: parseInt(pForm.age) || 0, gender: pForm.gender,
                mobile: pForm.mobile, guardian: pForm.guardian, relation: pForm.relation,
                blood: pForm.blood, type: pForm.type, bed: pForm.bed, emergency: pForm.emergency, history: pForm.history
              };
            }
            return p;
          }));
          setEditingPatientId(null);
          alert('Patient details updated successfully!');
        } else {
          const newPid = 'PID-' + Math.floor(1000 + Math.random() * 9000);
          const newPatient = {
            id: newPid, name: pForm.name, age: parseInt(pForm.age) || 0, gender: pForm.gender,
            mobile: pForm.mobile, guardian: pForm.guardian, relation: pForm.relation,
            blood: pForm.blood, type: pForm.type, bed: pForm.bed, emergency: pForm.emergency,
            history: pForm.history, date: new Date().toLocaleDateString()
          };

          setPatients(prev => [...prev, newPatient]);

          if (pForm.bed !== 'None') {
            setBeds(pb => pb.map(b => b.id === pForm.bed ? { ...b, status: 'Occupied' } : b));
          }
          alert('Patient admitted successfully!');
        }

        setPForm({
          name: '', age: '', gender: 'Male', mobile: '', guardian: '', relation: 'Father',
          blood: 'O+', type: 'OPD (Outpatient)', bed: 'None', emergency: '', history: ''
        });
      };

      const handleEditPatient = (p) => {
        setEditingPatientId(p.id);
        setPForm({
          name: p.name, age: p.age.toString(), gender: p.gender, mobile: p.mobile,
          guardian: p.guardian, relation: p.relation, blood: p.blood, type: p.type,
          bed: p.bed, emergency: p.emergency, history: p.history
        });
      };

      const handleDeletePatient = (id, bed) => {
        if (confirm('Are you sure you want to permanently delete this patient record?')) {
          setPatients(prev => prev.filter(p => p.id !== id));
          if (bed && bed !== 'None') {
            setBeds(pb => pb.map(b => b.id === bed ? { ...b, status: 'Available' } : b));
          }
        }
      };

      // Doctors Submit & Edit
      const handleDoctorSubmit = (e) => {
        e.preventDefault();
        if (editingDoctorId) {
          setDoctors(prev => prev.map(d => d.id === editingDoctorId ? {
            ...d, name: dForm.name, spec: dForm.spec, time: dForm.time, fees: parseInt(dForm.fees) || 0
          } : d));
          setEditingDoctorId(null);
          alert('Doctor specialist updated successfully!');
        } else {
          const newDoc = {
            id: 'DOC-' + Math.floor(100 + Math.random() * 900),
            name: dForm.name, spec: dForm.spec, time: dForm.time, fees: parseInt(dForm.fees) || 0
          };
          setDoctors(prev => [...prev, newDoc]);
          alert('Specialist Consultant registered successfully!');
        }
        setDForm({ name: '', spec: '', time: '', fees: '' });
      };

      const handleEditDoctor = (d) => {
        setEditingDoctorId(d.id);
        setDForm({ name: d.name, spec: d.spec, time: d.time, fees: d.fees.toString() });
      };

      const handleDeleteDoctor = (id) => {
        if (confirm('Delete this specialist profile from chambers registry?')) {
          setDoctors(prev => prev.filter(d => d.id !== id));
        }
      };

      // Staff Member flows
      const handleStaffSubmit = (e) => {
        e.preventDefault();
        if (editingStaffId) {
          setStaff(prev => prev.map(s => s.id === editingStaffId ? {
            ...s, name: sForm.name, role: sForm.role, shift: sForm.shift, salary: parseInt(sForm.salary) || 0
          } : s));
          setEditingStaffId(null);
          alert('Staff member registry updated!');
        } else {
          const newS = {
            id: 'STF-' + Math.floor(1000 + Math.random() * 9000),
            name: sForm.name, role: sForm.role, shift: sForm.shift, salary: parseInt(sForm.salary) || 0, status: 'Present'
          };
          setStaff(prev => [...prev, newS]);
          alert('Staff registered successfully!');
        }
        setSForm({ name: '', role: 'Nurse', shift: 'Day (8 AM - 4 PM)', salary: '' });
      };

      const handleEditStaff = (s) => {
        setEditingStaffId(s.id);
        setSForm({ name: s.name, role: s.role, shift: s.shift, salary: s.salary.toString() });
      };

      const handleDeleteStaff = (id) => {
        if (confirm('Permanently delete staff record from CareFlow HMS?')) {
          setStaff(prev => prev.filter(s => s.id !== id));
        }
      };

      const toggleStaffAttendance = (id, status) => {
        setStaff(prev => prev.map(s => s.id === id ? { ...s, status } : s));
      };

      // Pharmacy stocks flows
      const handleMedicineSubmit = (e) => {
        e.preventDefault();
        if (editingMedName) {
          setMedicines(prev => prev.map(m => m.name === editingMedName ? {
            name: mForm.name, batch: mForm.batch, qty: parseInt(mForm.qty) || 0, price: parseFloat(mForm.price) || 0
          } : m));
          setEditingMedName(null);
          alert('Medicine inventory adjusted successfully!');
        } else {
          if (medicines.find(m => m.name.toLowerCase() === mForm.name.toLowerCase())) {
            alert('This medicine is already listed in the catalog.');
            return;
          }
          const newMed = {
            name: mForm.name, batch: mForm.batch, qty: parseInt(mForm.qty) || 0, price: parseFloat(mForm.price) || 0
          };
          setMedicines(prev => [...prev, newMed]);
          alert('New stock registered.');
        }
        setMForm({ name: '', batch: '', qty: '', price: '' });
      };

      const handleEditMedicine = (m) => {
        setEditingMedName(m.name);
        setMForm({ name: m.name, batch: m.batch, qty: m.qty.toString(), price: m.price.toString() });
      };

      const handleDeleteMedicine = (name) => {
        if (confirm('Permanently delete medication item from stock ledger?')) {
          setMedicines(prev => prev.filter(m => m.name !== name));
        }
      };

      // Bed / Rooms flow
      const handleBedSubmit = (e) => {
        e.preventDefault();
        if (editingBedId) {
          setBeds(prev => prev.map(b => b.id === editingBedId ? {
            id: bForm.id, type: bForm.type, status: bForm.status
          } : b));
          setEditingBedId(null);
          alert('Cabin details updated!');
        } else {
          if (beds.find(b => b.id.toLowerCase() === bForm.id.toLowerCase())) {
            alert('A Cabin / Bed with this label already exists.');
            return;
          }
          const newB = { id: bForm.id, type: bForm.type, status: bForm.status };
          setBeds(prev => [...prev, newB]);
          alert('New Cabin Ward instance initialized.');
        }
        setBForm({ id: '', type: 'General', status: 'Available' });
      };

      const handleEditBed = (b) => {
        setEditingBedId(b.id);
        setBForm({ id: b.id, type: b.type, status: b.status });
      };

      const handleDeleteBed = (id) => {
        if (confirm('Delete this Cabin Room unit from configuration inventory?')) {
          setBeds(prev => prev.filter(b => b.id !== id));
        }
      };

      // Outdoor token appointments
      const handleAppointmentSubmit = (e) => {
        e.preventDefault();
        if (editingAppToken) {
          setAppointments(prev => prev.map(a => a.token === editingAppToken ? {
            ...a, name: aForm.name, doc: aForm.doc, date: aForm.date
          } : a));
          setEditingAppToken(null);
          alert('Appointment ticket details modified.');
        } else {
          const newAppNo = 'TK-' + (appointments.length + 101);
          const newApp = { token: newAppNo, name: aForm.name, doc: aForm.doc, date: aForm.date };
          setAppointments(prev => [...prev, newApp]);
          alert('OPD Appointment Token generated successfully!');
        }
        setAForm({ name: '', doc: '', date: '' });
      };

      const handleEditAppointment = (a) => {
        setEditingAppToken(a.token);
        setAForm({ name: a.name, doc: a.doc, date: a.date });
      };

      const handleDeleteAppointment = (token) => {
        if (confirm('Revoke scheduled OPD token representation?')) {
          setAppointments(prev => prev.filter(a => a.token !== token));
        }
      };

      // Accounts / Receipts billing generator
      const handleGenerateInvoice = (e) => {
        e.preventDefault();
        const pObj = patients.find(p => p.id === bPatient);
        if (!pObj) {
          alert('Please select a valid admitted patient.');
          return;
        }

        const isIpd = pObj.type.includes('IPD');
        const calculatedBedCost = isIpd ? 2500 : 0;
        const consultFee = doctors[0] ? doctors[0].fees : 1000;
        const routineTestsIndex = isIpd ? 1500 : 800;
        const totalCalculated = calculatedBedCost + consultFee + routineTestsIndex;

        let processedDateString = bDate;
        if (processedDateString) {
          const dateParts = new Date(processedDateString);
          processedDateString = `${dateParts.getMonth() + 1}/${dateParts.getDate()}/${dateParts.getFullYear()}`;
        } else {
          processedDateString = new Date().toLocaleDateString();
        }

        const newBill = {
          invoice: 'INV-' + Math.floor(10000 + Math.random() * 90000),
          patientId: pObj.id,
          patientName: pObj.name,
          patientMobile: pObj.mobile,
          total: totalCalculated,
          date: processedDateString,
          isDischarged: false,
          dischargeNotes: '',
          dispensedMedicines: [],
          breakdown: {
            bed: calculatedBedCost, doc: consultFee, ot: 0, test: routineTestsIndex, med: 0
          }
        };

        setBills(prev => [newBill, ...prev]);
        alert(`Billing invoice ${newBill.invoice} successfully dispatched! Total ledger calculated: ?${totalCalculated}`);
      };

      const handleDeleteBill = (invoice) => {
        if (confirm('Are you sure you want to permanently purge this invoice record?')) {
          setBills(prev => prev.filter(b => b.invoice !== invoice));
        }
      };

      // Advanced bill editor modals
      const openAdjuster = (bill) => {
        setActiveBillAdjustment(bill);
        setAdjBed(bill.breakdown.bed);
        setAdjDoc(bill.breakdown.doc);
        setAdjOt(bill.breakdown.ot);
        setAdjTest(bill.breakdown.test);
        setIsAdjustmentOpen(true);

        if (medicines.length > 0) {
          setAdjMedSelected(medicines[0].name);
        }
      };

      const handleAddMedicineToInvoice = () => {
        if (!activeBillAdjustment || !adjMedSelected) return;

        const originalDrug = medicines.find(m => m.name === adjMedSelected);
        if (!originalDrug || originalDrug.qty < adjMedQty) {
          alert(`Insufficient Pharmacy Stock. Only ${originalDrug ? originalDrug.qty : 0} units left.`);
          return;
        }

        // Deduct from dynamic store stocks
        setMedicines(prev => prev.map(m => m.name === adjMedSelected ? { ...m, qty: m.qty - adjMedQty } : m));

        // Adjust ledger totals inside bills array
        const medPriceAccrued = adjMedQty * originalDrug.price;
        setBills(prev => prev.map(b => {
          if (b.invoice === activeBillAdjustment.invoice) {
            const listCopy = [...(b.dispensedMedicines || [])];
            const foundIndex = listCopy.findIndex(dm => dm.name === adjMedSelected);

            if (foundIndex !== -1) {
              listCopy[foundIndex].qty += adjMedQty;
              listCopy[foundIndex].subtotal += medPriceAccrued;
            } else {
              listCopy.push({
                name: adjMedSelected, qty: adjMedQty, unitPrice: originalDrug.price, subtotal: medPriceAccrued
              });
            }

            const collectiveMedFee = (b.breakdown.med || 0) + medPriceAccrued;
            const fullSum = b.breakdown.bed + b.breakdown.doc + b.breakdown.ot + b.breakdown.test + collectiveMedFee;

            const updatedBill = {
              ...b,
              dispensedMedicines: listCopy,
              breakdown: { ...b.breakdown, med: collectiveMedFee },
              total: fullSum
            };

            // Sync with local adjuster modal copy state
            setActiveBillAdjustment(updatedBill);
            return updatedBill;
          }
          return b;
        }));

        alert(`Dispensed ${adjMedQty} units of ${adjMedSelected} successfully!`);
      };

      const handleSaveInvoiceAdjustments = () => {
        if (!activeBillAdjustment) return;

        setBills(prev => prev.map(b => {
          if (b.invoice === activeBillAdjustment.invoice) {
            const compiledMath = adjBed + adjDoc + adjOt + adjTest + (b.breakdown.med || 0);
            return {
              ...b,
              breakdown: { bed: adjBed, doc: adjDoc, ot: adjOt, test: adjTest, med: b.breakdown.med },
              total: compiledMath
            };
          }
          return b;
        }));

        setIsAdjustmentOpen(false);
        setActiveBillAdjustment(null);
        alert('Financial ledger entries and treatments adjustments verified!');
      };

      // Discharge handler
      const openDischargeModal = (bill) => {
        setActiveDischargeBill(bill);
        setDischargeNotesText('');
        setIsDischargeOpen(true);
      };

      const handleConfirmDischarge = (e) => {
        e.preventDefault();
        if (!activeDischargeBill) return;

        const attachedPatient = patients.find(p => p.id === activeDischargeBill.patientId);
        if (attachedPatient && attachedPatient.bed !== 'None') {
          const releasedBedId = attachedPatient.bed;
          setBeds(prev => prev.map(b => b.id === releasedBedId ? { ...b, status: 'Available' } : b));
        }

        setBills(prev => prev.map(b => b.invoice === activeDischargeBill.invoice ? {
          ...b, isDischarged: true, dischargeNotes: dischargeNotesText
        } : b));

        setIsDischargeOpen(false);
        setActiveDischargeBill(null);
        alert('Discharge procedures verified! Bed released successfully.');
      };


      // --- LIVE PERFORMANCE & STATS GRAPH QUERIES ---
      const stats = useMemo(() => {
        const totalIncome = bills.reduce((acc, b) => acc + b.total, 0);
        const lowStockCount = medicines.filter(m => m.qty < 10).length;
        const availableBedsCount = beds.filter(b => b.status === 'Available').length;
        const admittedPatientsCount = patients.length;

        return { totalIncome, lowStockCount, availableBedsCount, admittedPatientsCount };
      }, [bills, medicines, beds, patients]);

      const filteredInvoices = useMemo(() => {
        let parsedStart = billStartDate ? new Date(billStartDate).setHours(0, 0, 0, 0) : null;
        let parsedEnd = billEndDate ? new Date(billEndDate).setHours(23, 59, 59, 999) : null;

        return bills.filter(b => {
          if (parsedStart || parsedEnd) {
            const dVal = new Date(b.date).getTime();
            if (parsedStart && dVal < parsedStart) return false;
            if (parsedEnd && dVal > parsedEnd) return false;
          }
          if (searchBillName && !b.patientName.toUpperCase().includes(searchBillName.toUpperCase())) return false;
          if (searchBillPhone && !b.patientMobile.includes(searchBillPhone)) return false;
          return true;
        });
      }, [bills, billStartDate, billEndDate, searchBillName, searchBillPhone]);

      const filteredPatients = useMemo(() => {
        return patients.filter(p => {
          const lower = searchPatient.toUpperCase();
          return (
            p.id.toUpperCase().includes(lower) ||
            p.name.toUpperCase().includes(lower) ||
            (p.guardian && p.guardian.toUpperCase().includes(lower)) ||
            p.mobile.includes(lower)
          );
        });
      }, [patients, searchPatient]);

      useEffect(() => {
        if (patients.length > 0 && !bPatient) {
          setBPatient(patients[0].id);
        }
      }, [patients, bPatient]);

      // Excel Exporter as CSV standard
      const handleExportPatientsExcel = () => {
        if (patients.length === 0) {
          alert('No registries currently available to export.');
          return;
        }
        const csvHeaders = 'PatientID,Name,Age,Gender,Mobile,Guardian,Relation,Blood,AdmissionType,AssignedBed,EmergencyContact,History,Date';
        const csvRows = patients.map(p => 
          `"${p.id}","${p.name.replace(/"/g, '""')}",${p.age},"${p.gender}","${p.mobile}","${p.guardian ? p.guardian.replace(/"/g, '""') : ''}","${p.relation || ''}","${p.blood}","${p.type}","${p.bed || 'None'}","${p.emergency}","${p.history ? p.history.replace(/"/g, '""').replace(/\n/g, ' ') : ''}","${p.date}"`
        ).join('\n');

        const uriContent = 'data:text/csv;charset=utf-8,' + csvHeaders + '\n' + csvRows;
        const downloadElement = document.createElement('a');
        downloadElement.setAttribute('href', encodeURI(uriContent));
        downloadElement.setAttribute('download', 'CareFlow_HMS_Patients_Report.csv');
        document.body.appendChild(downloadElement);
        downloadElement.click();
        document.body.removeChild(downloadElement);
      };

      return (
        <div className="flex h-screen w-screen overflow-hidden bg-slate-50 text-slate-800">
          
          {/* SIDEBAR NAVIGATION BAR */}
          <aside className="w-64 bg-slate-900 text-white flex flex-col justify-between shrink-0 shadow-xl border-r border-slate-800">
            <div className="p-5 flex flex-col h-full overflow-y-auto">
              <div className="mb-6">
                <h1 className="text-xl font-bold tracking-tight flex items-center gap-2 text-white">
                  <LucideIcon name="activity" className="h-6 w-6 text-blue-400" />
                  <span>CareFlow HMS</span>
                </h1>
                <p className="text-[10px] text-gray-400 mt-1 uppercase tracking-widest font-mono">Core Admin Dashboard</p>
              </div>
              <hr className="border-slate-800 mb-5" />

              <nav className="space-y-1 flex-1">
                {[
                  { key: 'dashboard', name: 'Dashboard Analysis', icon: 'trending-up' },
                  { key: 'patient', name: 'Patients Ward Log', icon: 'users' },
                  { key: 'doctor', name: 'Doctors Registry', icon: 'stethoscope' },
                  { key: 'staff', name: 'Roster & Staff', icon: 'shield' },
                  { key: 'pharmacy', name: 'Pharmacy Store', icon: 'pill' },
                  { key: 'billing', name: 'Invoices & Accounts', icon: 'receipt' },
                  { key: 'beds', name: 'Beds & Cabins', icon: 'bed-double' },
                  { key: 'appointments', name: 'OPD Appointments', icon: 'calendar-check' }
                ].map(item => (
                  <button
                    key={item.key}
                    onClick={() => setActiveTab(item.key)}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded text-sm font-medium transition text-left cursor-pointer ${
                      activeTab === item.key ? 'bg-blue-600 border-l-4 border-blue-400 text-white shadow-md' : 'hover:bg-slate-850 text-gray-300'
                    }`}
                  >
                    <LucideIcon name={item.icon} className="h-4 w-4 text-blue-300" />
                    <span>{item.name}</span>
                  </button>
                ))}
              </nav>
            </div>
            
            <div className="p-4 bg-slate-950 text-[11px] text-center text-gray-400 font-mono tracking-wider border-t border-slate-900">
              &copy; 2026 CareFlow V1.2.0
            </div>
          </aside>

          {/* MAIN APPLICATION CONTAINER */}
          <div className="flex-1 flex flex-col h-full overflow-hidden">
            
            {/* DYNAMIC HEADER CONTROLS */}
            <header className="bg-white shadow-sm border-b border-gray-200 px-6 py-4 flex justify-between items-center shrink-0">
              <div className="flex items-center gap-3">
                <h2 className="text-lg font-bold tracking-tight text-slate-800 capitalize">
                  {activeTab === 'dashboard' ? 'Overview Metrics & Operations' : `${activeTab} interface management console`}
                </h2>
              </div>
              <div className="flex items-center gap-4">
                <span className="text-xs bg-emerald-50 text-emerald-800 border border-emerald-300 font-semibold px-2.5 py-1 rounded-full flex items-center gap-1.5 shadow-sm">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> ONLINE (LOCAL CLIENT DB)
                </span>
                <button
                  onClick={handleExportPatientsExcel}
                  className="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-1.5 rounded flex items-center gap-1.5 transition shadow cursor-pointer uppercase tracking-wider"
                >
                  <LucideIcon name="download" className="h-3.5 w-3.5" />
                  <span>Export CSV</span>
                </button>
              </div>
            </header>

            {/* MAIN ACTIONABLE WRAPPER */}
            <main className="p-6 flex-1 overflow-y-auto space-y-6">

              {/* ===================== DASHBOARD ANALYTICS PANEL ===================== */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  {/* Performance stats bento grids */}
                  <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                    
                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm border-l-4 border-blue-600 flex justify-between items-center">
                      <div>
                        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Admitted Patients</p>
                        <p className="text-3xl font-extrabold text-slate-800 mt-1">{stats.admittedPatientsCount}</p>
                      </div>
                      <LucideIcon name="users" className="h-8 w-8 text-blue-200" />
                    </div>

                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm border-l-4 border-emerald-600 flex justify-between items-center">
                      <div>
                        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Total System Income</p>
                        <p className="text-3xl font-extrabold text-slate-800 mt-1">?{stats.totalIncome}</p>
                      </div>
                      <LucideIcon name="receipt" className="h-8 w-8 text-emerald-200" />
                    </div>

                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm border-l-4 border-amber-500 flex justify-between items-center">
                      <div>
                        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Beds/Cabins Available</p>
                        <p className="text-3xl font-extrabold text-slate-800 mt-1">{stats.availableBedsCount}</p>
                      </div>
                      <LucideIcon name="bed-double" className="h-8 w-8 text-amber-200" />
                    </div>

                    <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm border-l-4 border-red-500 flex justify-between items-center">
                      <div>
                        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest font-mono">Critical Low Stocks</p>
                        <p className="text-3xl font-extrabold text-slate-800 mt-1">{stats.lowStockCount}</p>
                      </div>
                      <LucideIcon name="pill" className="h-8 w-8 text-red-200" />
                    </div>

                  </div>

                  {/* Real-Time Warnings and Secure Logs Row */}
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                      <h3 className="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <LucideIcon name="check-circle-2" className="h-5 w-5 text-blue-500" />
                        <span>Real-Time Notifications & Smart SMS Queue</span>
                      </h3>
                      <div className="space-y-3">
                        <div className="p-3 bg-blue-50 border-l-4 border-blue-500 rounded text-xs text-blue-950 flex justify-between items-center">
                          <span><strong>Reminder Triggered:</strong> Patient admission confirmation dispatched via SMS Gateway APIs.</span>
                          <span className="text-[9px] bg-blue-200 text-blue-800 px-1.5 py-0.5 rounded uppercase font-bold shrink-0 ml-2">Sent</span>
                        </div>
                        <div className="p-3 bg-green-50 border-l-4 border-green-500 rounded text-xs text-green-950 flex justify-between items-center">
                          <span><strong>System Sync Audit:</strong> Completed automated billing ledger sync audit status for Cabin stays.</span>
                          <span className="text-[9px] bg-green-200 text-green-800 px-1.5 py-0.5 rounded uppercase font-bold shrink-0 ml-2">Verified</span>
                        </div>
                        {stats.lowStockCount > 0 && (
                          <div className="p-3 bg-red-50/70 border-l-4 border-red-500 rounded text-xs text-red-950 flex justify-between items-center">
                            <span><strong>Critical Drug Alert:</strong> {stats.lowStockCount} Pharmacy items reached restock thresholds.</span>
                            <span className="text-[9px] bg-red-200 text-red-800 px-1.5 py-0.5 rounded uppercase font-bold shrink-0 ml-2">Restock Priority</span>
                          </div>
                        )}
                      </div>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm">
                      <h3 className="text-base font-bold text-slate-800 mb-3 flex items-center gap-2">
                        <LucideIcon name="database" className="h-5 w-5 text-purple-600" />
                        <span>Secure Local Databases & Operational Console Logs</span>
                      </h3>
                      <div className="p-4 bg-slate-950 rounded-lg text-xs font-mono text-cyan-400 space-y-1.5 max-h-[160px] overflow-y-auto">
                        <p><span className="text-green-400 font-bold">[SUCCESS]</span> CareFlow Core Local Storage sync transaction completed.</p>
                        <p><span className="text-blue-400 font-bold">[INFO]</span> Action Log: Registered active sessions mapping successfully.</p>
                        <p><span className="text-amber-400 font-bold">[WARN]</span> Medical inventory safety metrics re-evaluated.</p>
                        <p><span className="text-purple-400 font-bold">[REVENUE]</span> Invoices balance reconciled successfully with client accounting system.</p>
                      </div>
                    </div>

                  </div>
                </div>
              )}


              {/* ===================== PATIENTS TAB ===================== */}
              {activeTab === 'patient' && (
                <div className="space-y-6">
                  {/* Dynamic Add / Edit Admission Form */}
                  <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <h3 className="text-base font-bold text-slate-800 mb-4 flex items-center gap-2 border-b pb-2">
                      <LucideIcon name="plus-circle" className="h-5 w-5 text-blue-600" />
                      <span>{editingPatientId ? `?? Edit Patient Admissions Logs: ${editingPatientId}` : 'Register New Admitted Patient (OPD/IPD)'}</span>
                    </h3>

                    <form onSubmit={handlePatientSubmit} className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Patient Full Name *</label>
                        <input
                          type="text" required value={pForm.name}
                          onChange={e => setPForm({ ...pForm, name: e.target.value })}
                          placeholder="e.g. Abul Kalam Azad"
                          className="w-full border border-gray-200 p-2 rounded text-xs focus:ring-2 focus:ring-blue-500 outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Age & Gender *</label>
                        <div className="flex gap-2">
                          <input
                            type="number" required placeholder="Age" value={pForm.age}
                            onChange={e => setPForm({ ...pForm, age: e.target.value })}
                            className="w-1/2 border border-gray-200 p-2 rounded text-xs outline-none"
                          />
                          <select
                            value={pForm.gender}
                            onChange={e => setPForm({ ...pForm, gender: e.target.value })}
                            className="w-1/2 border border-gray-200 p-2 rounded text-xs bg-white outline-none"
                          >
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                          </select>
                        </div>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Mobile Contact Number *</label>
                        <input
                          type="tel" required placeholder="e.g. 017xxxxxxxx" value={pForm.mobile}
                          onChange={e => setPForm({ ...pForm, mobile: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Guardian / Parent Name *</label>
                        <input
                          type="text" required placeholder="e.g. Jasmin Rahman" value={pForm.guardian}
                          onChange={e => setPForm({ ...pForm, guardian: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Relation of Guardian *</label>
                        <select
                          value={pForm.relation}
                          onChange={e => setPForm({ ...pForm, relation: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs bg-white outline-none"
                        >
                          <option>Father</option>
                          <option>Mother</option>
                          <option>Spouse</option>
                          <option>Son</option>
                          <option>Daughter</option>
                          <option>Relative / Other</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Blood Group</label>
                        <select
                          value={pForm.blood}
                          onChange={e => setPForm({ ...pForm, blood: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs bg-white outline-none"
                        >
                          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
                          <option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Admission Type</label>
                        <select
                          value={pForm.type}
                          onChange={e => {
                            const val = e.target.value;
                            setPForm({ ...pForm, type: val, bed: val.includes('OPD') ? 'None' : pForm.bed });
                          }}
                          className="w-full border border-gray-200 p-2 rounded text-xs bg-white outline-none"
                        >
                          <option>OPD (Outpatient)</option>
                          <option>IPD (Indoor Patient)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Assign Bed Cabin Slot</label>
                        <select
                          disabled={pForm.type.includes('OPD')}
                          value={pForm.bed}
                          onChange={e => setPForm({ ...pForm, bed: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs bg-white outline-none disabled:bg-gray-100 disabled:text-gray-400"
                        >
                          <option value="None">None / OPD Slot</option>
                          {beds.map(b => (
                            <option key={b.id} value={b.id} disabled={b.status === 'Occupied' && pForm.bed !== b.id}>
                              {b.id} ({b.type}) - {b.status}
                            </option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Alternate Emergency Phone</label>
                        <input
                          type="tel" placeholder="e.g. 018xxxxxxxx" value={pForm.emergency}
                          onChange={e => setPForm({ ...pForm, emergency: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs outline-none"
                        />
                      </div>
                      <div className="md:col-span-3">
                        <label className="block text-xs font-bold text-gray-500 mb-1">Clinical Diagnostics History / Complains</label>
                        <textarea
                          rows={2} value={pForm.history}
                          onChange={e => setPForm({ ...pForm, history: e.target.value })}
                          placeholder="Primary complains, medical observations, prescription records..."
                          className="w-full border border-gray-200 p-2 rounded text-xs outline-none focus:ring-1 focus:ring-blue-500"
                        ></textarea>
                      </div>
                      <div className="md:col-span-3 flex justify-end gap-2 border-t pt-3">
                        {editingPatientId && (
                          <button
                            type="button"
                            onClick={() => {
                              setEditingPatientId(null);
                              setPForm({
                                name: '', age: '', gender: 'Male', mobile: '', guardian: '', relation: 'Father',
                                blood: 'O+', type: 'OPD (Outpatient)', bed: 'None', emergency: '', history: ''
                              });
                            }}
                            className="bg-gray-500 hover:bg-gray-600 text-white font-bold px-4 py-2 rounded text-xs transition cursor-pointer"
                          >
                            Cancel
                          </button>
                        )}
                        <button
                          type="submit"
                          className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2 rounded text-xs transition shadow cursor-pointer uppercase tracking-wider"
                        >
                          {editingPatientId ? 'Update Records' : 'Save & Admit Patient'}
                        </button>
                      </div>
                    </form>
                  </div>

                  {/* Patients Logs Table */}
                  <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
                    <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                      <h3 className="text-base font-bold text-slate-800">Facility Ward Admissions Roster</h3>
                      <div className="relative w-full md:w-80">
                        <input
                          type="text" placeholder="Live Search Patient Name, ID, Guardian..." value={searchPatient}
                          onChange={e => setSearchPatient(e.target.value)}
                          className="w-full border border-gray-200 pl-4 pr-4 py-2 rounded text-xs outline-none focus:ring-1 focus:ring-blue-500"
                        />
                      </div>
                    </div>

                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead>
                          <tr className="bg-gray-50 border-b border-gray-200 text-gray-500 font-bold uppercase tracking-wider">
                            <th className="p-3">Patient ID</th><th className="p-3">Name (Age/Gen)</th><th className="p-3">Guardian Profile</th>
                            <th className="p-3">Admission Type</th><th className="p-3">Cabin Bed</th><th className="p-3">Blood Type</th>
                            <th className="p-3">Admitted Date</th><th className="p-3 text-center">Action Options</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100 text-gray-700">
                          {filteredPatients.length === 0 ? (
                            <tr><td colSpan={8} className="p-3 text-center text-gray-400 italic">No corresponding patient data currently registered.</td></tr>
                          ) : (
                            filteredPatients.map(p => (
                              <tr key={p.id} className="hover:bg-slate-50/50 transition text-xs">
                                <td className="p-3 font-mono font-bold text-blue-600">{p.id}</td>
                                <td className="p-3 font-semibold text-gray-800">
                                  <div>{p.name}</div>
                                  <span className="text-[10px] text-gray-400">{p.age} Yrs / {p.gender}</span>
                                </td>
                                <td className="p-3">
                                  <div className="font-semibold text-gray-700">{p.guardian}</div>
                                  <div className="text-[10px] text-gray-400">{p.relation}</div>
                                </td>
                                <td className="p-3">
                                  <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${p.type.includes('IPD') ? 'bg-amber-100 text-amber-900 border border-amber-200' : 'bg-green-100 text-green-900 border border-green-200'}`}>
                                    {p.type}
                                  </span>
                                </td>
                                <td className="p-3">
                                  <span className="flex items-center gap-1 font-semibold text-gray-600">
                                    <LucideIcon name="bed-double" className="h-3.5 w-3.5 text-blue-500" />
                                    <span>{p.bed || 'OPD Slot'}</span>
                                  </span>
                                </td>
                                <td className="p-3 font-mono text-xs font-bold text-red-600">{p.blood}</td>
                                <td className="p-3 text-gray-500">{p.date}</td>
                                <td className="p-3 text-center">
                                  <div className="flex justify-center items-center gap-3">
                                    <button onClick={() => handleEditPatient(p)} className="text-blue-500 hover:text-blue-700 cursor-pointer p-1 rounded hover:bg-blue-50 transition">
                                      <LucideIcon name="edit-2" className="h-3.5 w-3.5" />
                                    </button>
                                    <button onClick={() => handleDeletePatient(p.id, p.bed)} className="text-red-500 hover:text-red-700 cursor-pointer p-1 rounded hover:bg-red-50 transition">
                                      <LucideIcon name="trash-2" className="h-3.5 w-3.5" />
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
