                      <span>{editingBedId ? '?? Modify Cabin Configuration details' : 'Register New Facility Bed Cabin Room'}</span>
                    </h3>

                    <form onSubmit={handleBedSubmit} className="grid grid-cols-1 md:grid-cols-4 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Cabin Code label Name *</label>
                        <input
                          type="text" required placeholder="e.g. Cabin-208" value={bForm.id}
                          onChange={e => setBForm({ ...bForm, id: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs outline-none uppercase font-mono"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Cabin Ward Room type *</label>
                        <select
                          value={bForm.type} onChange={e => setBForm({ ...bForm, type: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs bg-white outline-none"
                        >
                          <option value="Deluxe">Deluxe Comfort Bed</option>
                          <option value="Critical Care">Critical Care / ICU</option>
                          <option value="General">General Cabin</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Cabin Occupancy status</label>
                        <select
                          value={bForm.status} onChange={e => setBForm({ ...bForm, status: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs bg-white outline-none"
                        >
                          <option value="Available">Available</option>
                          <option value="Occupied">Occupied</option>
                        </select>
                      </div>
                      <div className="flex items-end gap-2">
                        {editingBedId && (
                          <button
                            type="button" onClick={() => { setEditingBedId(null); setBForm({ id: '', type: 'General', status: 'Available' }); }}
                            className="bg-gray-500 hover:bg-gray-600 text-white font-semibold px-4 py-2 rounded text-xs transition cursor-pointer"
                          >
                            Cancel
                          </button>
                        )}
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-2.5 rounded text-xs transition uppercase tracking-wider cursor-pointer">
                          {editingBedId ? 'Update Bed' : 'Register Cabin Room'}
                        </button>
                      </div>
                    </form>
                  </div>

                  {/* Bed representation grid matrices visualizer */}
                  <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
                    <h3 className="text-base font-bold text-slate-800">Bed Cabin Registry Status Monitor</h3>
                    <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-4 font-sans">
                      {beds.map(b => (
                        <div
                          key={b.id}
                          className={`p-4 rounded-xl border text-center transition flex flex-col justify-between ${
                            b.status === 'Available'
                              ? 'bg-emerald-50/50 border-emerald-300 text-emerald-950 hover:bg-emerald-50'
                              : 'bg-rose-50/50 border-rose-300 text-rose-950 hover:bg-rose-50'
                          }`}
                        >
                          <div>
                            <LucideIcon name="bed-double" className="h-6 w-6 mx-auto mb-2 text-slate-600" />
                            <div className="font-extrabold text-sm font-mono tracking-tight text-slate-800">{b.id}</div>
                            <div className="text-[9px] text-gray-400 font-bold uppercase tracking-wide">{b.type}</div>
                          </div>

                          <div className="mt-3 space-y-2">
                            <span className={`inline-block text-[9px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full ${
                              b.status === 'Available' ? 'bg-emerald-200 text-emerald-900' : 'bg-rose-200 text-rose-900'
                            }`}>
                              {b.status}
                            </span>
                            <div className="flex justify-center items-center gap-1.5 border-t border-gray-200/50 pt-2 text-[10px] w-full">
                              <button onClick={() => handleEditBed(b)} className="text-blue-500 hover:text-blue-700 font-semibold p-1 px-2 border rounded bg-white hover:bg-blue-50 cursor-pointer">Edit</button>
                              <button onClick={() => handleDeleteBed(b.id)} className="text-red-500 hover:text-red-700 font-semibold p-1 px-2 border rounded bg-white hover:bg-red-50 cursor-pointer">Del</button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}


              {/* ===================== APPOINTMENTS TAB ===================== */}
              {activeTab === 'appointments' && (
                <div className="space-y-6">
                  {/* Scheduler Form */}
                  <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm">
                    <h3 className="text-sm font-bold text-slate-800 border-b pb-2 flex items-center gap-1.5 mb-4">
                      <LucideIcon name="calendar-check" className="h-4.5 w-4.5 text-indigo-600" />
                      <span>{editingAppToken ? `?? Edit OPD Appointment Ticket Address: ${editingAppToken}` : 'OPD Token Appointment Scheduler'}</span>
                    </h3>

                    <form onSubmit={handleAppointmentSubmit} className="grid grid-cols-1 md:grid-cols-4 gap-4 font-sans">
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Patient Name *</label>
                        <input
                          type="text" required placeholder="e.g. Jasim Ahmed" value={aForm.name}
                          onChange={e => setAForm({ ...aForm, name: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs outline-none"
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Select Specialist Doctor *</label>
                        <select
                          value={aForm.doc} onChange={e => setAForm({ ...aForm, doc: e.target.value })} required
                          className="w-full border border-gray-200 p-2 rounded text-xs bg-white outline-none"
                        >
                          <option value="">-- Choose Specialist Doctor --</option>
                          {doctors.map(d => (
                            <option key={d.id} value={`Dr. ${d.name} (${d.spec})`}>Dr. {d.name} ({d.spec})</option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 mb-1">Appointment Date *</label>
                        <input
                          type="date" required value={aForm.date} onChange={e => setAForm({ ...aForm, date: e.target.value })}
                          className="w-full border border-gray-200 p-2 rounded text-xs outline-none"
                        />
                      </div>
                      <div className="flex items-end gap-2">
                        {editingAppToken && (
                          <button
                            type="button" onClick={() => { setEditingAppToken(null); setAForm({ name: '', doc: '', date: '' }); }}
                            className="bg-gray-500 hover:bg-gray-600 text-white font-semibold px-4 py-2 rounded text-xs transition cursor-pointer"
                          >
                            Cancel
                          </button>
                        )}
                        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold p-2.5 rounded text-xs transition uppercase tracking-wider cursor-pointer shadow-sm">
                          {editingAppToken ? 'Update Slot' : 'Generate Token Slot'}
                        </button>
                      </div>
                    </form>
                  </div>

                  {/* Operational appointment listings list */}
                  <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-4">
                    <h3 className="text-base font-bold text-slate-800">Operational Active Appointments chamber tokens</h3>
                    <div className="overflow-x-auto">
                      <table className="w-full text-left text-xs border-collapse font-sans">
                        <thead>
                          <tr className="bg-gray-50 border-b border-gray-200 text-gray-500 font-bold uppercase tracking-wider">
                            <th className="p-3">Token Co Code</th><th className="p-3">Patient Name</th><th className="p-3">Department Specialist Consultant</th>
                            <th className="p-3">Scheduled Date</th><th className="p-3 text-center">Action Options</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-gray-100 text-gray-700">
                          {appointments.map(a => (
                            <tr key={a.token} className="hover:bg-slate-50/50 transition">
                              <td className="p-3 font-mono font-extrabold text-indigo-700">{a.token}</td>
                              <td className="p-3 font-semibold text-slate-800">{a.name}</td>
                              <td className="p-3">
                                <span className="px-2 py-0.5 rounded text-[10px] bg-indigo-50 border border-indigo-200 text-indigo-950 font-bold uppercase">{a.doc}</span>
                              </td>
                              <td className="p-3 text-gray-500 font-mono font-medium">{a.date}</td>
                              <td className="p-3 text-center">
                                <div className="flex justify-center items-center gap-2">
                                  <button onClick={() => handleEditAppointment(a)} className="text-blue-500 hover:text-blue-700 p-1 rounded hover:bg-blue-50 transition cursor-pointer">
                                    <LucideIcon name="edit-2" className="h-3.5 w-3.5" />
                                  </button>
                                  <button onClick={() => handleDeleteAppointment(a.token)} className="text-red-500 hover:text-red-700 p-1 rounded hover:bg-red-50 transition cursor-pointer">
                                    <LucideIcon name="trash-2" className="h-3.5 w-3.5" />
                                  </button>
                                </div>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>

          {/* ===================== PORTAL MODAL WINDOWS WRAPPER ===================== */}

          {/* 1. COMPREHENSIVE MEDICAL CASE LEDGER SHEET STATEMENT PRINTER INVOICE */}
          {isInvoiceOpen && activeInvoice && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl flex flex-col max-h-[90vh]">
                <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-gray-50 rounded-t-xl shrink-0">
                  <h3 className="text-sm font-extrabold text-slate-800 flex items-center gap-2 font-sans uppercase tracking-wide">
                    <LucideIcon name="file-text" className="h-5 w-5 text-purple-650" />
                    <span>Admission Case Ledger Sheet: </span>
                    <span className="text-purple-700 font-mono">{activeInvoice.invoice}</span>
                  </h3>
                  <button onClick={() => { setIsInvoiceOpen(false); setActiveInvoice(null); }} className="text-gray-400 hover:text-gray-600 text-2xl font-bold cursor-pointer">&times;</button>
                </div>

                <div className="p-6 overflow-y-auto space-y-5 text-slate-700 text-xs flex-1">
                  
                  {/* Basic meta definitions */}
                  <div className="grid grid-cols-2 gap-4 bg-slate-50 border border-slate-200 p-4 rounded-lg">
                    <div>
                      <p className="text-[10px] text-gray-400 uppercase tracking-widest font-bold">Patient Profile ID</p>
                      <p className="font-bold text-slate-800 text-sm mt-0.5">{activeInvoice.patientName}</p>
                      <p className="text-gray-500 text-[10px] font-mono">{activeInvoice.patientId}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-gray-400 uppercase tracking-widest font-bold">Mobile Registered details</p>
                      <p className="font-semibold text-slate-700 font-mono">{activeInvoice.patientMobile || 'N/A'}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-gray-400 uppercase tracking-widest font-bold">Invoiced Date Slot</p>
                      <p className="font-semibold text-slate-800 font-mono">{activeInvoice.date}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-gray-400 uppercase tracking-widest font-bold">Current Release Status</p>
                      <span className={`inline-block px-2 py-0.5 rounded text-[10px] font-extrabold uppercase mt-1 ${activeInvoice.isDischarged ? 'bg-emerald-100 text-emerald-900 border border-emerald-350' : 'bg-red-100 text-red-900 border border-red-200'}`}>
                        {activeInvoice.isDischarged ? 'RELEASED STATUS' : 'ADMITTED ACTIVE'}
                      </span>
                    </div>
                  </div>

                  {/* Treatments records summaries inside invoice case ledger */}
                  <div className="border border-slate-200 rounded-lg p-4 space-y-3 bg-white">
                    <h4 className="font-bold text-slate-850 flex items-center gap-2 border-b pb-1">
                      <LucideIcon name="activity" className="h-4 w-4 text-blue-500" />
                      <span>Clinical Treatments & Medication Case Entries</span>
                    </h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                      <div>
                        <span className="text-[9px] bg-slate-100 text-slate-800 px-1.5 py-0.5 rounded font-extrabold uppercase tracking-wider">Consultants chamber Visits</span>
                        <p className="mt-1 text-gray-500 italic p-2 rounded bg-slate-50">Regular vital monitor checks executed successfully.</p>
                      </div>
                      <div>
                        <span className="text-[9px] bg-indigo-50 text-indigo-900 px-1.5 py-0.5 rounded font-extrabold uppercase tracking-wider">clinical Nurse Observations</span>
                        <p className="mt-1 text-gray-500 italic p-2 rounded bg-slate-50">Heartbeat, oxygen level parameters checked stable.</p>
                      </div>
                      <div className="md:col-span-2">
                        <span className="text-[9px] bg-purple-50 text-purple-900 px-1.5 py-0.5 rounded font-extrabold uppercase tracking-wider">Dispensed Medicines Administered</span>
                        <div className="mt-1 border border-slate-100 rounded p-3 bg-slate-50 mb-1">
                          {activeInvoice.dispensedMedicines && activeInvoice.dispensedMedicines.length > 0 ? (
                            <ul className="list-disc list-inside space-y-1 font-mono text-slate-700 text-xs">
                              {activeInvoice.dispensedMedicines.map((m, idx) => (
                                <li key={idx}>
                                  {m.name} (Qty: {m.qty} x ?{m.unitPrice} = ?{m.subtotal})
                                </li>
                              ))}
                            </ul>
                          ) : (
                            <p className="text-gray-400 italic">No Pharmacy prescriptions dispensed to this patient case ledger yet.</p>
                          )}
                        </div>
                      </div>
                      {activeInvoice.isDischarged && (
                        <div className="md:col-span-2 bg-emerald-50 border border-emerald-200 p-3 rounded">
                          <span className="text-[9px] bg-emerald-250 text-emerald-900 px-1.5 py-0.5 rounded font-extrabold uppercase">Final Clinical Release prescription advisory</span>
                          <p className="mt-1.5 text-slate-800 font-medium whitespace-pre-wrap">{activeInvoice.dischargeNotes}</p>
                        </div>
                      )}
                    </div>
                  </div>

                  {/* Pricing breakdowns ledger statements */}
                  <div className="border border-gray-200 rounded-lg overflow-hidden">
                    <div className="bg-slate-50 p-3 border-b border-gray-200 font-bold uppercase tracking-wider text-slate-600 text-[10px]">Computed Financial Ledger Accruals Statement</div>
                    <table className="w-full text-xs text-left border-collapse">
                      <thead>
                        <tr className="bg-slate-100/50 border-b text-gray-500 font-bold uppercase tracking-wide">
                          <th className="p-3">Cost index Category</th><th className="p-3 text-right">Accrued Subtotal</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100 font-mono">
                        <tr>
                          <td className="p-2.5 font-sans">Cabin Room Occupancy Stays Index (?)</td>
                          <td className="p-2.5 text-right font-extrabold text-slate-700">?{activeInvoice.breakdown?.bed || 0}</td>
                        </tr>
                        <tr>
                          <td className="p-2.5 font-sans">Specialist Consultancy & Checkups charges (?)</td>
                          <td className="p-2.5 text-right font-extrabold text-slate-700">?{activeInvoice.breakdown?.doc || 0}</td>
                        </tr>
                        <tr>
                          <td className="p-2.5 font-sans">OT surgery Surcharges (?)</td>
                          <td className="p-2.5 text-right font-extrabold text-slate-700">?{activeInvoice.breakdown?.ot || 0}</td>
                        </tr>
                        <tr>
                          <td className="p-2.5 font-sans">Diagnostics Pathology Clinic Tests (?)</td>
                          <td className="p-2.5 text-right font-extrabold text-slate-700">?{activeInvoice.breakdown?.test || 0}</td>
                        </tr>
                        <tr>
                          <td className="p-2.5 font-sans">Pharmacy Prescribed Drugs Accruant (?)</td>
                          <td className="p-2.5 text-right font-extrabold text-slate-700">?{activeInvoice.breakdown?.med || 0}</td>
                        </tr>
                        <tr className="bg-purple-100/50 text-slate-900 font-extrabold text-sm font-sans">
                          <td className="p-3">settled Statement grand Ledger balance (?)</td>
                          <td className="p-3 text-right font-mono text-purple-750">?{activeInvoice.total}</td>
                        </tr>
                      </tbody>
                    </table>
                  </div>

                </div>

                <div className="p-4 bg-gray-50 border-t border-gray-200 flex justify-end gap-2 shrink-0">
                  <button onClick={() => { setIsInvoiceOpen(false); setActiveInvoice(null); }} className="bg-slate-650 hover:bg-slate-700 text-slate-800 border bg-white font-bold px-4 py-2 rounded text-xs transition cursor-pointer">Close</button>
                  <button onClick={() => { setIsInvoiceOpen(false); openAdjuster(activeInvoice); }} className="bg-amber-600 hover:bg-amber-700 text-white font-bold px-4 py-2 rounded text-xs transition cursor-pointer">Edit Ledger Values</button>
                  <button onClick={() => window.print()} className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded text-xs flex items-center gap-1.5 transition cursor-pointer shadow">
                    <LucideIcon name="printer" className="h-3.5 w-3.5" />
                    <span>Print Statement</span>
                  </button>
                </div>
              </div>
            </div>
          )}


          {/* 2. CUSTOM FINANCIAL LEDGER VALUES ADJUSTMENTS & DISPENSARY MODAL */}
          {isAdjustmentOpen && activeBillAdjustment && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg flex flex-col">
                <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl shrink-0">
                  <h3 className="text-sm font-bold text-gray-800 flex items-center gap-2">
                    <LucideIcon name="receipt" className="h-5 w-5 text-blue-600" />
                    <span>Custom Invoice Adjuster Ledger adjustments:</span>
                    <span className="text-purple-650 font-mono">{activeBillAdjustment.invoice}</span>
                  </h3>
                  <button onClick={() => { setIsAdjustmentOpen(false); setActiveBillAdjustment(null); }} className="text-gray-400 hover:text-gray-650 text-xl font-bold cursor-pointer">&times;</button>
                </div>

                <div className="p-4 space-y-4 text-xs text-slate-700 max-h-[75vh] overflow-y-auto flex-1">
                  
                  {/* Current Active Patient details summary inside edit bill popup */}
                  <div className="p-3 bg-slate-50 border border-slate-200 rounded tracking-tight">
                    <p className="text-[9px] text-gray-400 font-extrabold uppercase tracking-widest text-slate-500 mb-0.5">Target Admitted Patient ID</p>
                    <span className="font-extrabold text-slate-900 font-mono text-xs">{activeBillAdjustment.patientId} - {activeBillAdjustment.patientName}</span>
                  </div>

                  {/* Medicine dispenser console inside modify bill modal */}
                  <div className="border border-purple-200 bg-purple-50/30 p-3 rounded-lg space-y-3 font-sans">
                    <h4 className="font-bold text-purple-950 flex items-center gap-1">
                      <LucideIcon name="pill" className="h-4 w-4 text-purple-700" />
                      <span>Dispense Drugs directly from stock to case ledger</span>
                    </h4>
                    <div className="grid grid-cols-3 gap-2">
                      <div className="col-span-2">
                        <label className="block text-[9px] text-slate-500 font-bold mb-1 uppercase tracking-wider">Select Available Medication</label>
                        <select
                          value={adjMedSelected} onChange={e => setAdjMedSelected(e.target.value)}
                          className="w-full border border-gray-200 bg-white p-1.5 rounded outline-none"
                        >
                          <option value="">-- Choose drug stock --</option>
                          {medicines.map(m => (
                            <option key={m.name} value={m.name} disabled={m.qty <= 0}>
                              {m.name} (Stock: {m.qty} | rate: ?{m.price})
                            </option>
                          ))}
                        </select>
                      </div>
                      <div>
                        <label className="block text-[9px] text-slate-500 font-bold mb-1 uppercase tracking-wider">Dispense Count</label>
                        <input
                          type="number" min={1} value={adjMedQty} onChange={e => setAdjMedQty(parseInt(e.target.value) || 1)}
                          className="w-full border border-gray-200 bg-white p-1.5 rounded outline-none"
                        />
                      </div>
                    </div>
                    <button
                      type="button" onClick={handleAddMedicineToInvoice}
                      className="w-full bg-purple-700 hover:bg-purple-800 text-white font-bold p-1.5 rounded uppercase tracking-wider transition cursor-pointer text-[10px]"
                    >
                      + Add & deduct pharmacy stocks level
                    </button>
                  </div>

                  {/* Numerical invoice value adjustment inputs */}
                  <div className="border border-slate-200 p-3 rounded bg-white space-y-3 font-sans">
                    <h4 className="font-bold border-b pb-1 text-slate-500 text-[10px] uppercase tracking-wider">Custom Manual Accounting adjustments</h4>
                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div>
                        <label className="block text-gray-500 font-bold mb-1 font-sans">Cabin stay charges (?)</label>
                        <input
                          type="number" value={adjBed} onChange={e => setAdjBed(parseInt(e.target.value) || 0)}
                          className="w-full border border-gray-200 p-1.5 rounded"
                        />
                      </div>
                      <div>
                        <label className="block text-gray-500 font-bold mb-1 font-sans">Consultant fees (?)</label>
                        <input
                          type="number" value={adjDoc} onChange={e => setAdjDoc(parseInt(e.target.value) || 0)}
                          className="w-full border border-gray-200 p-1.5 rounded"
                        />
                      </div>
                      <div>
                        <label className="block text-gray-500 font-bold mb-1 font-sans">OT Surcharges (?)</label>
                        <input
                          type="number" value={adjOt} onChange={e => setAdjOt(parseInt(e.target.value) || 0)}
                          className="w-full border border-gray-200 p-1.5 rounded"
                        />
                      </div>
                      <div>
                        <label className="block text-gray-500 font-bold mb-1 font-sans">Diagnostics Pathology (?)</label>
                        <input
                          type="number" value={adjTest} onChange={e => setAdjTest(parseInt(e.target.value) || 0)}
                          className="w-full border border-gray-200 p-1.5 rounded"
                        />
                      </div>
                    </div>
                    <div className="pt-2 flex justify-between items-center font-bold text-xs text-slate-900 border-t">
                      <span>Running Medicine dispenser subtotal cost:</span>
                      <span className="text-purple-705 font-mono text-sm">?{activeBillAdjustment.breakdown?.med || 0}</span>
                    </div>
                  </div>

                </div>

                <div className="p-4 bg-gray-50 border-t flex justify-end gap-2 rounded-b-xl shrink-0 font-sans">
                  <button onClick={() => { setIsAdjustmentOpen(false); setActiveBillAdjustment(null); }} className="bg-slate-300 hover:bg-slate-400 text-slate-700 border bg-white font-bold px-4 py-1.5 rounded cursor-pointer">Cancel</button>
                  <button type="button" onClick={handleSaveInvoiceAdjustments} className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-1.5 rounded cursor-pointer transition uppercase text-xs shadow">Save Adjustments</button>
                </div>
              </div>
            </div>
          )}


          {/* 3. CLINICAL RELEASE NOTE & DISCHARGE PROCEDURES MODAL PANEL */}
          {isDischargeOpen && activeDischargeBill && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-md flex flex-col">
                <div className="p-4 border-b flex justify-between items-center bg-gray-50 rounded-t-xl shrink-0">
                  <h3 className="text-sm font-bold text-gray-800 flex items-center gap-2 uppercase tracking-wide">
                    <LucideIcon name="x" className="h-5 w-5 text-rose-500" />
                    <span>Confirm Release Pat & Discharge Sheet</span>
                  </h3>
                  <button onClick={() => { setIsDischargeOpen(false); setActiveDischargeBill(null); }} className="text-gray-400 hover:text-gray-650 text-xl font-bold cursor-pointer">&times;</button>
                </div>

                <form onSubmit={handleConfirmDischarge} className="p-4 space-y-4 text-xs">
                  <div className="p-3 bg-red-50/50 border border-rose-200 rounded">
                    <span className="block text-[9px] text-gray-400 font-bold uppercase tracking-wider mb-0.5">Patient Profile Admissions meta</span>
                    <span className="font-extrabold text-slate-900 font-mono text-xs">
                      {activeDischargeBill.patientId} - {activeDischargeBill.patientName} ({activeDischargeBill.invoice})
                    </span>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-gray-500 mb-1">Final discharge notes / Prescriptions / Clinical recovery advisory *</label>
                    <textarea
                      required rows={4} value={dischargeNotesText} onChange={e => setDischargeNotesText(e.target.value)}
                      placeholder="E.g. Vitals checked and stable during clinical round metrics audits. Adhere strictly to 2-weeks physical bed resting schedules..."
                      className="w-full border border-gray-250 p-2.5 rounded text-xs outline-none focus:ring-1 focus:ring-red-400 font-medium leading-relaxed"
                    ></textarea>
                  </div>

                  <div className="flex justify-end gap-2 border-t pt-3 font-sans">
                    <button type="button" onClick={() => { setIsDischargeOpen(false); setActiveDischargeBill(null); }} className="bg-gray-550 border hover:bg-gray-600 text-slate-700 font-bold px-4 py-2 rounded cursor-pointer">Cancel</button>
                    <button type="submit" className="bg-red-600 hover:bg-red-700 text-white font-bold px-4 py-2 rounded shadow-sm cursor-pointer uppercase tracking-wider">Confirm Release & Vacate Cabin Bed</button>
                  </div>
                </form>
              </div>
            </div>
          )}

        </div>
      );
    }

    // --- DOM BOOTSTRAP INJECTOR ENGINE ---
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
